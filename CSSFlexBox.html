<html>
    <head> 
        <style>
            .flex-container { 
                display: flex;
                flex-direction: row-reverse;
                background-color: DodgerBlue;

            }
            .container div {
                background-color: #f1f1f1;
                margin: 10px;
                padding: 20px;
                font-size: 24px;
            }
            
        </style>
    </head>
    <body>
        <h1>Create a Flexbox Container</h1>
        <div class="flex-container">
            <div> 1</div>
            <div> 2</div>
            <div> 3</div>
            <div> 4</div>
            <div> 5</div>
            <div> 6</div>
        </div>
    </body>
</html>
