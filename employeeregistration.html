<!DOCTYPE html>
<html>
    <head><title>Student Registration Form</title></head>
    <body bgcolor="lightyellow">
        <h1>Employee Registration Form</h1>
        <form> 
            <label>Employee Name:</label>
            <input type="text" name="sname">
            <br><br>

             <label>Password:</label>
            <input type="password" name="password" required>
            <br><br>

             <label>Email:</label>
            <input type="email" name="email">
             <br><br>

            <label>Mobile Number:</label>
            <input type="text" patern="[0-9]" name="password" required placeholder="Enter 10-digits">
            <br><br>

             <label>Age:</label>
            <input type="number" name="age">
            <br><br>

            <label>Date of Birth</label>
            <input type="date" name="dob">
            <br> <br>

            <label>Preferred Interview Time</label>
            <input type="time" name="time">
            <br><br>

            <label>Gender</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

             <label>Skill</label>
            <input type="checkbox" name="skill"> HTML
             <input type="checkbox" name="skill"> CSS
              <input type="checkbox" name="skill"> JAVA
            <br><br>

            

            <label>Department</label>
            <select name="department"> 
                <option>Select Department</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>IT</option>
            </select>
            <br><br>

            <label>Upload Resume:</label>
            <input type="file" name="resume" accept="pdf,doc,docx">
            <br><br>


            Address:
            <textarea name="address" rows="4" cols="30"
            placeholder="Enter your address"
            required minlength="10"></textarea>
            <br><br>

            <label>Work Experince</label>
            <input type="range" name="work">
            <br><br>

            <label>LinkedLn Profile</label>
            <input type="text" name="url" placeholder="Enter Linkedln URL">
            <br><br>

             <input type="submit" value="Register">
            <input type="reset" value="clear">
            <br><br>


        </form>

    </body>

</html>
