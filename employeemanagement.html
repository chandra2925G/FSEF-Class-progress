<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Information</title>
  <style>
    body {
      background-color: #dcdcdc;
      font-family: Arial, Helvetica, sans-serif;
    }

    .employee-card {
      background-color: #add8e6; /* Light blue content + padding area */
      border: 4px solid #000080;   /* Dark navy border */
      padding: 36px 44px;          /* Inner space between border and text */
      margin: 40px;                /* Outer space around the box */
      max-width: 560px;
    }

    .employee-card p {
      margin: 18px 0;
      font-size: 24px;
      color: #000000;
    }

    .employee-card strong {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="employee-card">
    <p><strong>Employee ID:</strong> EMP101</p>
    <p><strong>Name:</strong> Ravi Kumar</p>
    <p><strong>Designation:</strong> Software Developer</p>
    <p><strong>Department:</strong> IT</p>
  </div>
</body>
</html>
