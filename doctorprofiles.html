<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Information</title>
  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 32px 24px;
    }

    h1 {
      text-align: center;
      color: #00008b;
      font-size: 32px;
      margin-top: 0;
      margin-bottom: 36px;
    }

    .doctors-container {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto;
    }

    .doctor-card {
      background-color: #ffffff;
      border: 2px solid #6ec6e8;
      border-radius: 14px;
      padding: 32px 24px;
      flex: 1 1 280px;
      max-width: 350px;
      text-align: center;
    }

    .doctor-card h2 {
      color: #00008b;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .doctor-card p {
      color: #333333;
      font-size: 18px;
      margin: 14px 0;
    }
  </style>
</head>
<body>
  <h1>Doctor Information</h1>

  <div class="doctors-container">
    <div class="doctor-card">
      <h2>Dr. Ujwal Amogh</h2>
      <p>Specialization: Cardiologist</p>
      <p>Experience: 10 Years</p>
      <p>Timing: 9 AM - 1 PM</p>
    </div>

    <div class="doctor-card">
      <h2>Dr. Sowrish</h2>
      <p>Specialization: Dermatologist</p>
      <p>Experience: 8 Years</p>
      <p>Timing: 10 AM - 2 PM</p>
    </div>

    <div class="doctor-card">
      <h2>Dr. Kumar</h2>
      <p>Specialization: Dentist</p>
      <p>Experience: 5 Years</p>
      <p>Timing: 2 PM - 6 PM</p>
    </div>
  </div>
</body>
</html>
